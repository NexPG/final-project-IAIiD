services:
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: music-support-triage:local
    environment:
      KAGGLE_USERNAME: "${KAGGLE_USERNAME:-}"
      KAGGLE_KEY: "${KAGGLE_KEY:-}"
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
      - ../configs:/app/configs:ro
      - ../scripts:/app/scripts:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f data/processed/dataset.csv ]; then
          python scripts/data/download_data.py --fetch-bitext
          python scripts/data/download_data.py --fetch-twcs
          python scripts/data/prepare_twcs.py
          python scripts/data/build_dataset.py --config configs/data.yaml
        fi
        if [ ! -f artifacts/model.joblib ]; then
          python scripts/train/train_final.py
        fi
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: music-support-triage:local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      SERVICE_CONFIG: /app/configs/service.yaml
      FEEDBACK_DB_PATH: /app/data/feedback/feedback.sqlite3
    volumes:
      - ../artifacts:/app/artifacts:ro
      - ../configs:/app/configs:ro
      - ../data/feedback:/app/data/feedback
    depends_on:
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
