groups:
  - name: music-support-triage
    rules:
      - alert: TriageApiDown
        expr: up{job="music-support-triage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Triage API is down"
          description: "Prometheus cannot scrape the API for 2 minutes."

      - alert: TriageModelNotReady
        expr: model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model artifact is not loaded"
          description: "All classification requests will return 503."

      - alert: TriageHigh5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 1% of requests fail with 5xx"
          description: "Check model readiness, logs and upstream routing."

      - alert: TriageHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 500 ms"
          description: "Check CPU, batch size and model size."

      - alert: TriageManualReviewRateHigh
        expr: |
          sum(rate(predictions_total{needs_review="true"}[10m]))
          /
          clamp_min(sum(rate(predictions_total[10m])), 0.000001) > 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 30% of requests go to manual review"
          description: "Confidence dropped or input distribution changed."

      - alert: TriageOtherShareHigh
        expr: |
          sum(rate(predictions_total{topic="other"}[10m]))
          /
          clamp_min(sum(rate(predictions_total[10m])), 0.000001) > 0.55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 55% of predictions are other"
          description: "Possible drift or a broken upstream form."

      - alert: TriageConfidenceLow
        expr: |
          histogram_quantile(
            0.5,
            sum(rate(prediction_confidence_bucket[10m])) by (le)
          ) < 0.60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Median top-1 confidence is below 0.60"
          description: "Check data drift, calibration and model version."
