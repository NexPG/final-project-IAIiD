[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-support-triage"
version = "0.1.0"
description = "Classification of music streaming support tickets into routing queues"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "final-project-IAIiD team" }]
keywords = ["nlp", "text-classification", "support", "fastapi", "mlops"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "prometheus-client>=0.20,<1.0",
    "structlog>=24.1,<26.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3,<3.0",
    "transformers>=4.43,<5.0",
    "datasets>=2.20,<4.0",
    "pyarrow>=15.0,<22.0",
    "mlflow>=2.15,<4.0",
    "evidently>=0.4,<1.0",
    "great-expectations>=1.0,<2.0",
    "matplotlib>=3.8,<4.0",
    "scipy>=1.13,<2.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "locust>=2.29,<3.0",
    "python-pptx>=1.0,<2.0",
    "python-docx>=1.1,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/music_support_triage"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib.*", "pandas.*", "sklearn.*", "yaml.*"]
ignore_missing_imports = true
