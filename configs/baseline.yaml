# Baseline training configuration.

seed: 42
data_path: data/processed/dataset.csv
model_path: artifacts/model.joblib
metrics_path: artifacts/metrics.json
model_card_path: artifacts/model_card.md

# Test uses weak/synthetic labels; metrics are reported as such.
allow_provisional: true
threshold: 0.85
margin_threshold: 0.05

model:
  word_max_features: 20000
  char_max_features: 30000
  c_value: 16.0
  # Selected by StratifiedGroupKFold CV in scripts/search_models.py.
  use_char: true
  word_ngram: [1, 1]
  word_min_df: 1
  char_ngram: [3, 5]
  char_min_df: 3
